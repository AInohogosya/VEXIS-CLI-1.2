# =============================================================================
# VEXIS-CLI-3 Configuration Example (NEW layered schema)
#
# Copy this file to `config.yaml` (or set VEXIS_CONFIG_DIR) and customize.
#
# SECURITY: API keys / secrets are NEVER stored here. They are resolved at
# runtime, in this order (most specific wins):
#   1. runtime override (CLI flag)   2. environment variable
#   3. .env file (python-dotenv)    4. OS keyring (optional)
# See https://github.com/AInohogosya/VEXIS-CLI-3 for the env-var name of
# each provider. A reference is printed by:  vexis providers
# =============================================================================

api:
  # Primary provider: ollama, google, openai, anthropic, xai, meta,
  # mistral, microsoft, amazon, cohere, deepseek, together, minimax,
  # zhipuai, openrouter
  preferred_provider: "ollama"

  # Ollama (local) settings -- no API key required
  local_endpoint: "http://localhost:11434"
  local_model: "llama3.2:3b"

  # Per-provider default model. Override per provider; the secret (API key)
  # is resolved from the environment / .env, NOT from this file.
  models:
    ollama: "llama3.2:3b"
    google: "gemini-3.1-pro-preview"
    openai: "gpt-4o"
    anthropic: "claude-3.5-sonnet-20241022"
    xai: "grok-2"
    meta: "llama-3.1-70b-instruct"
    mistral: "mistral-large-latest"
    microsoft: "gpt-4o"
    amazon: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    cohere: "command-r-plus"
    deepseek: "deepseek-chat"
    together: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
    minimax: "minimax-text-01"
    zhipuai: "glm-4"
    openrouter: "openai/gpt-oss-120b"

  # Timeouts / retries (validated: timeout > 0, max_retries >= 0)
  timeout: 60
  max_retries: 3
  retry_delay: 1.0

  # Prompt compression (triggers automatically near the token limit)
  compression_enabled: true
  compression_threshold: 6000       # tokens before compression
  compression_target_ratio: 50    # target size after compression (%)
  compression_max_tokens: 4000
  compression_model: ""            # empty = use current model

# Security Configuration (all features DISABLED by default)
security:
  enable_command_blocking: false
  enable_confirmation_prompts: false
  enable_sudo_warning: false
  enable_shell_pipe_warning: false
  enable_sandbox: true
  command_timeout: 1800

# Execution Configuration
execution:
  safety_mode: true
  dry_run: false
  verify_commands: true
  command_timeout: 1800
  task_timeout: 2700
  max_iterations: 500
  auto_recovery: true

# Logging Configuration
logging:
  level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  file: "vexis.log"       # optional log file path
  json_format: false
  console: true

# Cache Configuration
cache:
  enabled: true
  max_size: 1000
  ttl: 3600
  persist_to_disk: true

# Cost Management (USD). null = unlimited.
cost:
  daily_budget: null
  monthly_budget: null
  per_request_budget: null
  warning_threshold: 0.8
  critical_threshold: 0.95

# Performance Configuration
performance:
  max_concurrent_tasks: 1
  memory_limit_mb: 1024

# User Preferences
user:
  name: ""
  preferred_style: "detailed"  # concise, detailed, friendly
  auto_confirm: false
  show_progress: true

# Telegram Configuration (optional bot mode)
telegram:
  enabled: false
  bot_token: ""
  bot_username: ""
  api_id: 0
  api_hash: ""
  session_name: "vexis_telegram"
  contacts: []
  authorized_users: []
  output_recipients: []
  enable_input_listener: true
  send_phase2_end_updates: true
  max_history_length: 50

# Custom System Prompt (Phase 1 only; leave empty to disable)
custom_system_prompt: ""
