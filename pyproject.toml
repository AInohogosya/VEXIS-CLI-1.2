[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexis-cli"
version = "3.0.0"
description = "Advanced 5-Phase AI-powered terminal automation system"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "VEXIS Project"}
]
maintainers = [
    {name = "VEXIS Project"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
    "Environment :: Console",
    "Natural Language :: English",
]
keywords = [
    "ai", "automation", "cli", "terminal", "command-line",
    "natural-language", "agent", "llm", "multi-provider",
    "ollama", "openai", "anthropic", "groq", "gemini",
]
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "structlog>=23.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0",
    "pluggy>=1.0.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "groq>=0.5.0",
    "python-telegram-bot>=21.0.0",
    "python-dotenv>=1.0.0",
    # -- New peripheral-system dependencies (config / model settings / CLI) -- #
    "pydantic>=2.0,<3.0",          # validated config + model settings
    "typer>=0.12,<0.13",            # modern CLI framework
    "click>=8.1,<8.2",             # pinned for Typer 0.12 compatibility
    "pyautogui>=0.9.54; sys_platform=='darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform=='darwin'",
    "pywin32>=306; sys_platform=='win32'",
    "python-xlib>=0.33; sys_platform=='linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "isort>=5.0.0",
]
cloud = [
    "anthropic>=0.25.0",
    "google-genai>=0.3.0",
    "mistralai>=0.1.0",
    "boto3>=1.34.0",
    "cohere>=5.0.0",
]
all = [
    "vexis-cli[dev,cloud]",
]

[project.scripts]
# Primary, modern Typer-based CLI (drives the core FivePhaseAIAgent).
vexis = "ai_agent.user_interface.cli:app"
# Legacy argparse entry point (kept for backward compatibility).
vexis-legacy = "ai_agent.user_interface.five_phase_app:main"

[project.urls]
Homepage = "https://github.com/AInohogosya/VEXIS-CLI-3"
Repository = "https://github.com/AInohogosya/VEXIS-CLI-3"
"Bug Reports" = "https://github.com/AInohogosya/VEXIS-CLI-3/issues"
Discussions = "https://github.com/AInohogosya/VEXIS-CLI-3/discussions"
Changelog = "https://github.com/AInohogosya/VEXIS-CLI-3/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_agent = [
    "config/*.yaml",
    "config/*.json",
    "templates/*.txt",
    "scripts/*.sh",
    "scripts/*.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
